version: "3.8"

services:
  telemetry-sentry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemetry_sentry_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
